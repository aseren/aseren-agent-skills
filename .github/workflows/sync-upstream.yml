name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/addyosmani/agent-skills.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main
        id: merge
        run: |
          git checkout main
          git merge upstream/main --no-edit

      - name: Push
        if: steps.merge.outcome == 'success'
        run: git push origin main

      - name: Create PR on conflict
        if: failure() && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge --abort
          branch="sync-upstream-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git merge upstream/main --no-commit || true
          git add -A
          git commit -m "Sync upstream (conflicts need manual resolution)"
          git push origin "$branch"
          gh pr create \
            --title "Sync upstream (merge conflicts)" \
            --body "Automatic upstream sync failed due to merge conflicts. Please resolve manually."
